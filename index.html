<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Points de collecte — Vendanges 2026 — ICV</title>

<!-- Polices -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Leaflet (carte interactive) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  Version 1 : 2024-08-14 
  - Ajout des liens sur les logos en haut de page compatibles sur smartphone
  - Ajout du N° de téléphone de l'ICV en bas de page
-->


<style>
  /* ============================================================
     PALETTE / DESIGN TOKENS — modifier ici pour changer les couleurs
     ============================================================ */
  :root {
    /* Charte Oenobox / ICV (d'après capture d'écran réelle de l'interface) :
       rose/magenta comme couleur de marque principale, marine profond pour
       les titres, vert olive en accent secondaire, fond gris très clair.
       Les noms de variables sont conservés pour ne rien casser dans la mise
       en page ; seules les valeurs changent. */
    --font: 'Inter', 'Segoe UI', sans-serif;
    --ink: #241B45;
    --ink-soft: #6B647D;
    --wine: #C2136B;
    --wine-dark: #8F0E4E;
    --gold: #E39CC0;
    --gold-soft: #F7DCEA;
    --leaf: #6FA82E;
    --paper: #F4F5F7;
    --card: #FFFFFF;
    --line: #E5E7EB;
    --shadow: 0 1px 2px rgba(36,27,69,0.06), 0 8px 24px rgba(36,27,69,0.06);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 100% 0%, rgba(194,19,107,0.05) 0%, transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(111,168,46,0.06) 0%, transparent 40%);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px 80px; }

  /* ---------- LOGOS EN-TÊTE ---------- */
  .header-logos {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    width: 100%;
    margin: 0 auto 22px;
  }

  .header-logos a {
    display: block;
    line-height: 0;
    flex: 0 0 auto;
  }

  .header-logos img {
    display: block;
    height: auto;
    max-width: 100%;
    object-fit: contain;
  }

  .header-logos .logo-icv {
    width: 125px;
  }

  .header-logos .logo-oenobox {
    width: 200px;
  }

  /* ---------- EN-TÊTE ---------- */
  header.top { padding: 42px 24px 40px; text-align: center; position: relative; }
  .eyebrow {
    font-family: var(--font); font-size: 12.5px; letter-spacing: 0.1em; font-weight: 700;
    text-transform: uppercase; color: var(--wine); font-weight: 600; margin-bottom: 14px;
  }
  h1 {
    font-family: var(--font); font-weight: 800; font-size: clamp(32px, 5vw, 52px);
    line-height: 1.05; margin: 0 0 12px; color: var(--ink);
  }
  .sub { font-size: 16px; color: var(--ink-soft); max-width: 560px; margin: 0 auto; line-height: 1.55; }
  .vine-rule {
    width: 220px; height: 3px; margin: 22px auto 0;
    background-image: repeating-linear-gradient(90deg, var(--wine) 0, var(--wine) 8px, transparent 8px, transparent 14px),
      repeating-linear-gradient(90deg, var(--leaf) 0, var(--leaf) 8px, transparent 8px, transparent 14px);
    background-position: 0 0, 0 100%;
    background-size: 100% 1px;
    background-repeat: no-repeat;
    position: relative;
  }
  .vine-rule::before, .vine-rule::after { content: ''; position: absolute; left: 0; right: 0; height: 1.5px; background-image: repeating-linear-gradient(90deg, currentColor 0, currentColor 8px, transparent 8px, transparent 14px); }
  .vine-rule::before { top: 0; color: var(--wine); }
  .vine-rule::after { bottom: 0; color: var(--leaf); }
  .notice-saturday { margin: 10px 0 0; color: red; font-size: 14px; }

  /* ---------- ONGLETS (jours + carte) ---------- */
  .day-tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 40px 0 8px; }
  .day-tab {
    font-family: var(--font); font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
    padding: 11px 20px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card);
    color: var(--ink-soft); cursor: pointer; transition: all 0.18s ease;
  }
  .day-tab:hover { border-color: var(--gold); color: var(--ink); }
  .day-tab.active { background: var(--wine); border-color: var(--wine); color: #fff; box-shadow: var(--shadow); }
  .day-tab .count { opacity: 0.65; font-weight: 500; margin-left: 5px; }
  .day-tab.map-tab { border-color: var(--leaf); }
  .day-tab.map-tab.active { background: var(--leaf); border-color: var(--leaf); }

  /* ---------- FILTRE SECTEUR ---------- */
  .sector-filter-wrap { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 6px 0 30px; flex-wrap: wrap; }
  .sector-filter-label {
    font-family: var(--font); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-soft);
  }
  .sector-select {
    font-family: var(--font); font-size: 13px; font-weight: 600;
    padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer; appearance: none;
    -webkit-appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%236b5d4f'><path d='M5.5 7.5l4.5 4.5 4.5-4.5z'/></svg>");
    background-repeat: no-repeat; background-position: right 12px center; background-size: 14px;
    padding-right: 34px;
  }
  .sector-select:hover { border-color: var(--gold); }
  .sector-select:focus { outline: none; border-color: var(--wine); }
  .no-results { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 40px 0; }

  /* ---------- RECHERCHE PAR COMMUNE ---------- */
  .search-wrap { max-width: 520px; margin: 28px auto 0; position: relative; }
  .search-label {
    display: block; text-align: center; font-family: var(--font); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 8px;
  }
  .search-box { position: relative; }
  .search-input {
    width: 100%; box-sizing: border-box; font-family: var(--font); font-size: 14px;
    padding: 12px 40px 12px 18px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--ink); outline: none; transition: border-color 0.15s ease;
  }
  .search-input:focus { border-color: var(--wine); }
  .search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%; border: none; background: rgba(111,168,46,0.1);
    color: var(--ink-soft); font-size: 12px; cursor: pointer; line-height: 1;
  }
  .search-clear:hover { background: rgba(194,19,107,0.12); color: var(--wine); }
  .search-suggestions {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); overflow: hidden; display: none;
  }
  .search-suggestions.open { display: block; }
  .search-suggestion {
    padding: 11px 18px; cursor: pointer; border-bottom: 1px solid rgba(229,231,235,0.6);
    display: flex; flex-direction: column; gap: 1px;
  }
  .search-suggestion:last-child { border-bottom: 0; }
  .search-suggestion:hover, .search-suggestion.highlighted { background: rgba(194,19,107,0.06); }
  .search-suggestion .sugg-commune { font-family: var(--font); font-weight: 700; font-size: 13.5px; color: var(--ink); }
  .search-suggestion .sugg-site { font-size: 12px; color: var(--ink-soft); }
  .search-empty { padding: 12px 18px; font-size: 13px; color: var(--ink-soft); }
  #searchResult { margin-top: 18px; }
  #searchResult .site-card { border-color: var(--wine); }

  .helper-text { text-align: center; font-size: 13.5px; color: var(--ink-soft); margin: 18px 0 36px; }
  .helper-text strong { color: var(--wine); }

  /* ---------- FRISE (vue par jour) ---------- */
  .timeline { position: relative; margin-top: 28px; }
  .timeline::before {
    content: ''; position: absolute; left: 68px; top: 8px; bottom: 8px; width: 2px;
    background: repeating-linear-gradient(180deg, var(--gold-soft) 0, var(--gold-soft) 6px, transparent 6px, transparent 12px);
  }
  .stop { position: relative; display: grid; grid-template-columns: 68px 1fr; gap: 20px; margin-bottom: 18px; }
  .stop-time {
    font-family: var(--font); font-size: 14px; font-weight: 700; color: var(--wine-dark);
    text-align: right; padding-top: 16px; position: relative;
  }
  .stop-time::after {
    content: ''; position: absolute; right: -25px; top: 21px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--gold); border: 2px solid var(--paper); box-shadow: 0 0 0 2px var(--gold);
  }
  .stop-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; box-shadow: var(--shadow); }
  .stop-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .stop-commune { font-family: var(--font); font-size: 20px; font-weight: 700; color: var(--ink); }
  .stop-site { font-size: 13.5px; color: var(--wine); font-weight: 500; }
  .stop-addr { font-size: 13px; color: var(--ink-soft); margin: 4px 0 10px; }
  .stop-meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 10px; }
  .stop-meta .label { font-family: var(--font); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--leaf); font-weight: 700; display: block; margin-bottom: 2px; }
  .stop-meta .col { flex: 1; min-width: 180px; }
  .particularite {
    font-size: 13px; color: var(--wine-dark); background: rgba(194,19,107,0.06);
    border-left: 3px solid var(--wine); padding: 8px 12px; margin-top: 10px; border-radius: 0 6px 6px 0;
  }
  .particularite .label { font-family: var(--font); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--wine); font-weight: 700; display: block; margin-bottom: 2px; }

  /* ---------- GRILLE (vue "tous les points") ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 28px; }
  .site-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
  .site-card .stop-commune { font-size: 18px; }
  .site-card .stop-addr { margin-bottom: 12px; }
  .day-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .day-badge {
    font-family: var(--font); font-size: 11px; font-weight: 600; padding: 4px 9px;
    border-radius: 999px; background: rgba(111,168,46,0.1); color: var(--leaf);
  }
  .day-badge b { color: var(--wine-dark); font-weight: 700; }

  /* ---------- CARTE (vue "Carte") ---------- */
  .map-toolbar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 24px 0 16px; }
  .map-filter {
    font-family: var(--font); font-size: 12px; font-weight: 600; padding: 7px 14px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    cursor: pointer;
  }
  .map-filter:hover { border-color: var(--leaf); }
  .map-filter.active { background: var(--leaf); border-color: var(--leaf); color: #fff; }
  .map-intro {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    margin: 24px 0 12px;
  }
  .map-intro-title {
    font-family: var(--font); font-size: 20px; font-weight: 700; color: var(--ink);
  }
  .map-intro-note { font-size: 12.5px; color: var(--ink-soft); }
  #map-container {
    height: 820px; width: 100%; max-width: 620px; margin: 0 auto;
    border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .map-table-wrap {
    margin-top: 18px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
  }
  .map-table-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 14px 9px; border-bottom: 1px solid var(--line); }
  .map-table-title { font-family: var(--font); font-size: 17px; font-weight: 700; color: var(--ink); }
  .map-table-count { font-family: var(--font); font-size: 10.5px; color: var(--ink-soft); }
  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .map-table {
    width: 100%; min-width: 360px; border-collapse: collapse; font-size: 13px; table-layout: fixed;
  }
  .map-table th {
    padding: 10px 10px; text-align: left; font-family: var(--font); font-weight: 700;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--leaf); background: rgba(111,168,46,0.06); border-bottom: 1px solid var(--line);
    overflow-wrap: break-word;
  }
  .map-table td {
    padding: 9px 10px; border-bottom: 1px solid rgba(229,231,235,0.65); vertical-align: top;
    overflow-wrap: break-word;
  }
  .map-table tbody tr:last-child td { border-bottom: 0; }
  .map-table tbody tr:hover { background: rgba(194,19,107,0.035); }
  .map-table .num {
    font-family: var(--font); font-weight: 700; color: var(--wine);
  }
  .col-num { width: 8%; }
  .col-commune { width: 20%; }
  .col-site { width: 34%; }
  .col-navette { width: 38%; }
  .map-table .commune {
    font-weight: 600; color: var(--ink);
  }
  .map-table .site { color: var(--wine); font-weight: 500; }
  .map-table .days { color: var(--ink-soft); }
  .map-table .hours { color: var(--ink-soft); white-space: nowrap; }
  .map-table .navette { font-family: var(--font); font-weight: 700; color: var(--wine-dark); }
  .map-number {
    width: 28px; height: 28px; border-radius: 50%; background: var(--wine); color: #fff;
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font); font-size: 11px; font-weight: 700;
  }
  .leaflet-popup-content-wrapper { border-radius: 10px; font-family: var(--font); }
  .popup-commune { font-family: var(--font); font-weight: 700; font-size: 15px; color: var(--ink); }
  .popup-site { font-size: 12.5px; color: var(--wine); margin: 2px 0 4px; }
  .popup-meta { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .popup-meta .label { font-family: var(--font); font-size: 10px; text-transform: uppercase; font-weight: 700; color: var(--leaf); }
  .marker-pin {
    width: 26px; height: 26px; border-radius: 50% 50% 50% 0; background: var(--wine);
    transform: rotate(-45deg); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35);
  }

  footer {
    text-align: center; margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink-soft); font-family: var(--font);
  }

  @media (max-width: 560px) {
    /* En-tête mobile : les logos restent toujours dans la largeur de l'écran */
    header.top {
      padding: 28px 12px 32px;
    }

    .header-logos {
      gap: 12px;
      margin-bottom: 18px;
    }

    .header-logos .logo-icv {
      width: 100px;
    }

    .header-logos .logo-oenobox {
      width: 160px;
    }

    h1 {
      font-size: clamp(30px, 9vw, 42px);
    }

    .sub {
      font-size: 15px;
    }

    .day-tabs {
      margin-top: 28px;
      gap: 6px;
    }

    .day-tab {
      font-size: 12px;
      padding: 9px 13px;
    }

    .timeline::before { left: 52px; }
    .stop { grid-template-columns: 52px 1fr; gap: 14px; }
    .stop-time { font-size: 12px; }
    .stop-time::after { right: -19px; }
    #map-container { height: 620px; max-width: 100%; }
    .map-intro { display: block; }
    .map-intro-note { margin-top: 3px; }
    .map-table th, .map-table td { padding: 7px 6px; }
    .map-table th, .map-table td { font-size: 11.5px; }
    .col-num { width: 7%; }
    .col-commune { width: 18%; }
    .col-site { width: 33%; }
    .col-navette { width: 42%; }
  }
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="header-logos">
      <a href="https://www.icv.fr" target="_blank" rel="noopener noreferrer" aria-label="Groupe ICV">
        <img class="logo-icv" src="Logo.jpg" alt="Logo Groupe ICV">
      </a>
      <a href="https://oenobox.icv.fr/login" target="_blank" rel="noopener noreferrer" aria-label="Oenobox">
        <img class="logo-oenobox" src="oenobox.png" alt="Oenobox">
      </a>
    </div>
    <p class="eyebrow">ICV Provence</p>
    <h1>Points de collecte<br>Vendanges 2026</h1>
    <p class="sub">Collectes échantillons planifiées jusqu'au 23 octobre 2026 inclus.</p>
    <div class="vine-rule"></div>
    <p class="notice-saturday">1er Samedi = 22 Août 2026</p>
  </header>

  <div class="search-wrap" id="searchWrap">
    <label class="search-label" for="searchInput">Rechercher un point de collecte par commune</label>

      <button type="button" id="searchClear" class="search-clear" aria-label="Effacer la recherche" style="display:none;">✕</button>
      <div id="searchSuggestions" class="search-suggestions"></div>
    </div>
    <div id="searchResult"></div>
  </div>

  <nav class="day-tabs" id="dayTabs"></nav>
  <div class="sector-filter-wrap" id="sectorFilterWrap"></div>
  <p class="helper-text" id="helperText">L'échantillon doit être déposé <strong>avant l'horaire de navette</strong> indiqué pour votre point de collecte.</p>

  <div id="content"></div>

  <footer>ICV Provence · Vendanges 2026 · Accueil <a href="tel:+33000000000">04 94 37 01 90</a></footer>
</div>

const DAYS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
let current = 'carte'; // vue affichée au chargement : 'carte' | 'tous' | 'lundi'...
let mapInstance = null;
let mapMarkers = [];
let mapDayFilter = 'tous';
let sectorFilter = 'tous';

/* ---------------- Filtre secteur (transversal aux 3 vues) ---------------- */
function getSectors() {
  return [...new Set(DATA.all_sites.map(s => s.secteur).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
}
function renderSectorFilter() {
  const wrap = document.getElementById('sectorFilterWrap');
  const sectors = getSectors();
  wrap.innerHTML = `
    <span class="sector-filter-label">Secteur</span>
    <select class="sector-select" id="sectorSelect">
      <option value="tous">Tous les secteurs</option>
      ${sectors.map(s => `<option value="${s}">${s}</option>`).join('')}
    </select>`;
  const select = document.getElementById('sectorSelect');
  select.value = sectorFilter;
  select.onchange = (e) => { sectorFilter = e.target.value; render(); };
}

/* ---------------- Onglets ---------------- */
function renderTabs() {
  const tabs = document.getElementById('dayTabs');
  tabs.innerHTML = '';

  const mapBtn = document.createElement('button');
  mapBtn.className = 'day-tab map-tab' + (current === 'carte' ? ' active' : '');
  mapBtn.textContent = '🗺 Carte';
  mapBtn.onclick = () => { current = 'carte'; render(); };
  tabs.appendChild(mapBtn);

  const allBtn = document.createElement('button');
  allBtn.className = 'day-tab' + (current === 'tous' ? ' active' : '');
  allBtn.innerHTML = 'Tous les points';
  allBtn.onclick = () => { current = 'tous'; render(); };
  tabs.appendChild(allBtn);

  DAYS.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (current === d ? ' active' : '');
    btn.innerHTML = d ;
    btn.onclick = () => { current = d; render(); };
    tabs.appendChild(btn);
  });
}

/* ---------------- Vue "par jour" (frise chronologique) ---------------- */
function renderDayView(day) {
  const stops = DATA.by_day[day].filter(s => sectorFilter === 'tous' || s.secteur === sectorFilter);
  const el = document.createElement('div');
  el.className = 'timeline';
  if (!stops.length) {
    el.innerHTML = `<p class="no-results">Aucun point de collecte pour le secteur « ${sectorFilter} » ce jour-là.</p>`;
    return el;
  }
  stops.forEach(s => {
    const stop = document.createElement('div');
    stop.className = 'stop';
    stop.innerHTML = `
      <div class="stop-time">${s.navette || '—'}</div>
      <div class="stop-card">
        <div class="stop-head">
          <span class="stop-commune">${s.commune}</span>
          <span class="stop-site">${s.site}</span>
        </div>
        ${s.adresse ? `<div class="stop-addr">${s.adresse}</div>` : ''}
        <div class="stop-meta">
          <div class="col"><span class="label">Horaires de dépôt</span>${s.horaires || '—'}</div>
          <div class="col"><span class="label">Lieu de dépôt</span>${s.lieu_depot || '—'}</div>
        </div>
        ${s.particularite ? `<div class="particularite"><span class="label">Particularité</span>${s.particularite}</div>` : ''}
      </div>`;
    el.appendChild(stop);
  });
  return el;
}

/* ---------------- Vue "tous les points" (grille de fiches) ---------------- */
function buildSiteCard(s) {
  const card = document.createElement('div');
  card.className = 'site-card';
  const badges = s.jours_navette.map(jn =>
    `<span class="day-badge">${jn.jours_label} <b>${jn.navette || '—'}</b></span>`
  ).join('');
  card.innerHTML = `
    <div class="stop-head">
      <span class="stop-commune">${s.commune}</span>
    </div>
    <div class="stop-site" style="margin-bottom:4px;">${s.site}</div>
    ${s.adresse ? `<div class="stop-addr">${s.adresse}</div>` : ''}
    <div class="stop-meta">
      <div class="col"><span class="label">Horaires de dépôt</span>${s.horaires || '—'}</div>
      <div class="col"><span class="label">Lieu de dépôt</span>${s.lieu_depot || '—'}</div>
    </div>
    ${s.particularite ? `<div class="particularite"><span class="label">Particularité</span>${s.particularite}</div>` : ''}
    <div class="day-badges">${badges}</div>`;
  return card;
}

function renderAllView() {
  const el = document.createElement('div');
  el.className = 'grid';
  const sites = DATA.all_sites.filter(s => sectorFilter === 'tous' || s.secteur === sectorFilter);
  if (!sites.length) {
    el.innerHTML = `<p class="no-results">Aucun point de collecte pour le secteur « ${sectorFilter} ».</p>`;
    return el;
  }
  sites.forEach(s => el.appendChild(buildSiteCard(s)));
  return el;
}

/* ---------------- Vue "Carte" (Leaflet, focus vallée du Rhône) ---------------- */
function renderMapView() {
  const el = document.createElement('div');

  const toolbar = document.createElement('div');
  toolbar.className = 'map-toolbar';
  const filters = ['tous', ...DAYS];
  filters.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'map-filter' + (mapDayFilter === f ? ' active' : '');
    btn.textContent = f === 'tous' ? 'Tous les jours' : f;
    btn.onclick = () => { mapDayFilter = f; renderMapMarkers(); renderMapTable(); updateMapFilterButtons(); };
    btn.dataset.filter = f;
    toolbar.appendChild(btn);
  });
  el.appendChild(toolbar);

  const intro = document.createElement('div');
  intro.className = 'map-intro';

  const mapDiv = document.createElement('div');
  mapDiv.id = 'map-container';
  el.appendChild(mapDiv);

  const tableWrap = document.createElement('div');
  tableWrap.className = 'map-table-wrap';
  tableWrap.id = 'map-table-wrap';
  el.appendChild(tableWrap);
  // Le conteneur n'est pas encore dans le DOM global ici : on lui passe donc directement la cible.
  renderMapTable(tableWrap);

  // Le rendu Leaflet doit se faire une fois le div inséré dans le DOM.
  setTimeout(initMap, 0);

  return el;
}
function renderMapTable(targetWrap) {
  const wrap = targetWrap || document.getElementById('map-table-wrap');
  if (!wrap) return;

  const points = (mapDayFilter === 'tous' ? DATA.all_sites : DATA.by_day[mapDayFilter])
    .filter(p => sectorFilter === 'tous' || p.secteur === sectorFilter);
  const title = mapDayFilter === 'tous' ? 'Toutes les collectes' : `Collectes du ${mapDayFilter}`;

  wrap.innerHTML = `
    <div class="map-table-heading">
      <span class="map-table-title">${title}</span>
      <span class="map-table-count">${points.length} point${points.length > 1 ? 's' : ''}</span>
    </div>
    <div class="table-scroll">
    <table class="map-table">
      <colgroup>
        <col class="col-num">
        <col class="col-commune">
        <col class="col-site">
        <col class="col-navette">
      </colgroup>
      <thead>
        <tr>
          <th>N°</th>
          <th>Commune</th>
          <th>Lieu de collecte</th>
          <th>Navette</th>
        </tr>
      </thead>
      <tbody>
        ${points.map(p => {
          const number = DATA.all_sites.findIndex(s => s.commune === p.commune && s.site === p.site) + 1;
          const navette = mapDayFilter === 'tous'
            ? p.jours_navette.map(jn => `${jn.jours_label} : ${jn.navette || '—'}`).join(' · ')
            : (p.navette || '—');
          return `
            <tr>
              <td class="num">${number}</td>
              <td class="commune">${p.commune}</td>
              <td class="site">${p.site}</td>
              <td class="navette">${navette}</td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>`;
}

function updateMapFilterButtons() {
  document.querySelectorAll('.map-filter').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === mapDayFilter);
  });
}

function initMap() {
  if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  mapInstance = L.map('map-container', { scrollWheelZoom: true }).setView([43.57, 5.96], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(mapInstance);
  renderMapMarkers();
}

function renderMapMarkers() {
  if (!mapInstance) return;
  mapMarkers.forEach(m => mapInstance.removeLayer(m));
  mapMarkers = [];

  const points = (mapDayFilter === 'tous' ? DATA.all_sites : DATA.by_day[mapDayFilter])
    .filter(p => sectorFilter === 'tous' || p.secteur === sectorFilter);
  const bounds = [];

  points.forEach(p => {
    if (p.lat == null || p.lng == null) return;

    // Le numéro est calculé à partir de DATA.all_sites : aucune numérotation
    // à maintenir manuellement lorsque vous ajoutez/supprimez un point.
    const pointNumber = DATA.all_sites.findIndex(s =>
      s.commune === p.commune && s.site === p.site
    ) + 1;

    const markerIcon = L.divIcon({
      className: '',
      html: `<div class="map-number">${pointNumber}</div>`,
      iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -16]
    });

    const marker = L.marker([p.lat, p.lng], { icon: markerIcon }).addTo(mapInstance);
    const jourInfo = mapDayFilter === 'tous'
      ? p.jours_navette.map(jn => jn.jours_label + ' ' + (jn.navette || '')).join(' · ')
      : (p.navette || '');
    marker.bindPopup(
      '<div class="popup-commune">' + p.commune + '</div>' +
      '<div class="popup-site">' + p.site + '</div>' +
      '<div class="popup-meta"><span class="label">Navette</span> ' + jourInfo + '</div>' +
      (p.lieu_depot ? '<div class="popup-meta"><span class="label">Lieu de dépôt</span> ' + p.lieu_depot + '</div>' : '')
    );
    mapMarkers.push(marker);
    bounds.push([p.lat, p.lng]);
  });

  if (bounds.length) {
    mapInstance.invalidateSize();
    mapInstance.fitBounds(bounds, { padding: [30, 30], maxZoom: 13 });
  }
}

/* ---------------- Rendu principal ---------------- */
function render() {
  renderTabs();
  renderSectorFilter();
  const helper = document.getElementById('helperText');
  helper.style.display = current === 'carte' ? 'none' : 'block';

  const content = document.getElementById('content');
  content.innerHTML = '';
  if (current === 'carte') {
    content.appendChild(renderMapView());
  } else if (current === 'tous') {
    content.appendChild(renderAllView());
  } else {
    content.appendChild(renderDayView(current));
  }
}

render();

/* ---------------- Recherche par commune ---------------- */
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const searchSuggestionsEl = document.getElementById('searchSuggestions');
const searchResultEl = document.getElementById('searchResult');
let searchHighlightIndex = -1;
let currentSuggestions = [];

function normalize(str) {
  return (str || '').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // retire les accents
}

function getSuggestions(query) {
  const q = normalize(query);
  if (!q) return [];
  return DATA.all_sites
    .filter(s => normalize(s.commune).includes(q))
    .sort((a, b) => {
      const aStarts = normalize(a.commune).startsWith(q) ? 0 : 1;
      const bStarts = normalize(b.commune).startsWith(q) ? 0 : 1;
      if (aStarts !== bStarts) return aStarts - bStarts;
      return a.commune.localeCompare(b.commune, 'fr');
    })
    .slice(0, 8);
}

function renderSuggestions(list) {
  currentSuggestions = list;
  searchHighlightIndex = -1;
  if (!list.length) {
    searchSuggestionsEl.innerHTML = `<div class="search-empty">Aucune commune trouvée.</div>`;
    searchSuggestionsEl.classList.add('open');
    return;
  }
  searchSuggestionsEl.innerHTML = list.map((s, i) => `
    <div class="search-suggestion" data-index="${i}">
      <span class="sugg-commune">${s.commune}</span>
      <span class="sugg-site">${s.site}</span>
    </div>`).join('');
  searchSuggestionsEl.classList.add('open');
  searchSuggestionsEl.querySelectorAll('.search-suggestion').forEach(el => {
    el.addEventListener('click', () => selectSite(list[parseInt(el.dataset.index, 10)]));
  });
}

function closeSuggestions() {
  searchSuggestionsEl.classList.remove('open');
  searchSuggestionsEl.innerHTML = '';
  currentSuggestions = [];
  searchHighlightIndex = -1;
}

function selectSite(site) {
  searchInput.value = site.commune;
  closeSuggestions();
  searchClear.style.display = 'flex';
  searchResultEl.innerHTML = '';
  searchResultEl.appendChild(buildSiteCard(site));
  searchResultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

searchInput.addEventListener('input', () => {
  const val = searchInput.value;
  searchClear.style.display = val ? 'flex' : 'none';
  searchResultEl.innerHTML = '';
  if (!val) { closeSuggestions(); return; }
  renderSuggestions(getSuggestions(val));
});

searchInput.addEventListener('keydown', (e) => {
  if (!currentSuggestions.length) return;
  const items = searchSuggestionsEl.querySelectorAll('.search-suggestion');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    searchHighlightIndex = Math.min(searchHighlightIndex + 1, items.length - 1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    searchHighlightIndex = Math.max(searchHighlightIndex - 1, 0);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (searchHighlightIndex >= 0) selectSite(currentSuggestions[searchHighlightIndex]);
    return;
  } else if (e.key === 'Escape') {
    closeSuggestions();
    return;
  } else {
    return;
  }
  items.forEach((el, i) => el.classList.toggle('highlighted', i === searchHighlightIndex));
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.style.display = 'none';
  searchResultEl.innerHTML = '';
  closeSuggestions();
  searchInput.focus();
});

document.addEventListener('click', (e) => {
  if (!document.getElementById('searchWrap').contains(e.target)) {
    closeSuggestions();
  }
});
</script>
